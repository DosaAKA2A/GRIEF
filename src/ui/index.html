<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GRIEF</title>
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="barra">
    <button id="menu-boton" class="menu-boton" aria-label="Menu" aria-expanded="false">
      <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path d="M1 3h14M1 8h14M1 13h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="square"/></svg>
    </button>
    <div class="marca"><img src="logo.svg" alt="" class="marca-logo"><span class="marca-nombre">GRIEF</span><span class="marca-sub" id="juego">Valorant · LoL</span></div>
    <div id="fase" class="fase" hidden>
      <i class="fase-punto"></i><span id="fase-texto"></span>
    </div>
    <a id="actualizar" class="actualizar" hidden target="_blank" rel="noopener">Actualizar</a>
    <div id="estado" class="estado">Conectando...</div>
  </header>

  <nav id="menu-panel" class="menu-panel" hidden aria-label="Menu de la app">
    <button id="menu-acerca" class="menu-item">Acerca de</button>
    <button id="menu-terminos" class="menu-item">Terminos y condiciones</button>
    <button id="menu-actualizar" class="menu-item">Actualizar app</button>
    <span id="menu-estado" class="menu-estado" hidden></span>
  </nav>

  <div id="modal" class="modal" hidden>
    <div class="modal-caja" role="dialog" aria-modal="true" aria-labelledby="modal-titulo">
      <header class="modal-cabecera">
        <h3 id="modal-titulo"></h3>
        <button id="modal-cerrar" class="modal-cerrar" aria-label="Cerrar">&#215;</button>
      </header>
      <div id="modal-cuerpo" class="modal-cuerpo"></div>
    </div>
  </div>

  <template id="tpl-acerca">
    <p class="modal-destacado">GRIEF <span id="acerca-version"></span></p>
    <p>Match tracker de Valorant y League of Legends. Lee la API local del cliente de Riot en tu propio equipo: no usa overlays, no inyecta nada en el juego y no envia tus datos a ningun servidor.</p>
    <p>Un proyecto de Estudio de Iris.</p>
    <p><a href="https://grief.es" target="_blank" rel="noopener">grief.es</a> &middot; <a href="https://github.com/DosaAKA2A/GRIEF" target="_blank" rel="noopener">GitHub</a></p>
    <p class="modal-nota">GRIEF no esta afiliado a Riot Games ni cuenta con su respaldo. Riot Games, Valorant y League of Legends son marcas de Riot Games, Inc.</p>
  </template>

  <template id="tpl-terminos">
    <p>GRIEF se ofrece tal cual, sin garantias de ningun tipo. Al usar la app aceptas estas condiciones:</p>
    <ul>
      <li><b>Datos.</b> GRIEF lee la API local del cliente de Riot y las APIs de partida asociadas a tu sesion. Todo se procesa en tu equipo; no recopilamos, almacenamos ni compartimos datos personales.</li>
      <li><b>Senales.</b> Las alertas de posible cheater, smurf o booster son heuristicas con margen de error. Son orientativas y no constituyen acusaciones.</li>
      <li><b>Riot Games.</b> GRIEF no interfiere con el juego (sin overlay, sin inyeccion, sin automatizacion). Aun asi, el uso de herramientas de terceros queda bajo tu responsabilidad conforme a los terminos de servicio de Riot.</li>
      <li><b>Responsabilidad.</b> Estudio de Iris no se hace responsable de danos derivados del uso de la app ni de decisiones tomadas a partir de la informacion mostrada.</li>
      <li><b>Actualizaciones.</b> Las versiones nuevas se publican en GitHub. La app solo consulta la version publicada; descargar e instalar es siempre decision tuya.</li>
    </ul>
  </template>

  <main class="contenido">
    <section id="vacio" class="vacio">
      <svg class="vacio-radar" viewBox="0 0 100 100" aria-hidden="true">
        <circle cx="50" cy="50" r="48" />
        <circle cx="50" cy="50" r="32" />
        <circle cx="50" cy="50" r="16" />
        <line x1="50" y1="50" x2="50" y2="2" class="aguja" />
      </svg>
      <h1 class="vacio-titulo">Sin partida</h1>
      <p class="vacio-detalle">Abre Valorant o League of Legends para empezar</p>
    </section>

    <!-- Perfil propio: se muestra con el cliente abierto y sin partida -->
    <section id="perfil" class="perfil" hidden>
      <div class="perfil-cab">
        <div class="perfil-rango">
          <img id="perfil-rango-img" class="perfil-rango-img" src="" alt="">
          <div class="perfil-rango-textos">
            <span id="perfil-rango-nombre" class="perfil-rango-nombre"></span>
            <span id="perfil-rr" class="perfil-rr"></span>
            <div class="perfil-rr-barra"><i id="perfil-rr-relleno"></i></div>
          </div>
        </div>
        <div class="perfil-id">
          <h1 id="perfil-nombre"></h1>
          <span id="perfil-sub" class="perfil-sub"></span>
        </div>
        <div class="perfil-lados">
          <div class="perfil-lado">
            <img id="perfil-peak-img" class="perfil-peak-img" src="" alt="">
            <div><small>Peak</small><span id="perfil-peak"></span></div>
          </div>
          <div class="perfil-lado">
            <img id="perfil-agente-img" class="perfil-agente-img" src="" alt="">
            <div><small>Agente top</small><span id="perfil-agente"></span></div>
          </div>
        </div>
      </div>

      <div id="perfil-tiles" class="perfil-tiles"></div>

      <div class="perfil-partidas">
        <h2>Ultimas competitivas</h2>
        <ul id="perfil-lista"></ul>
      </div>
    </section>

    <section id="equipos" class="equipos" hidden>
      <div id="banda" class="banda" hidden>
        <div class="banda-textos">
          <span id="banda-titulo" class="banda-titulo"></span>
          <span id="banda-sub" class="banda-sub"></span>
        </div>
      </div>
      <div class="equipo aliado">
        <h2 id="titulo-aliado">Tu equipo</h2>
        <ul id="lista-aliado"></ul>
      </div>
      <div class="equipo rival" id="panel-rival">
        <h2 id="titulo-rival">Rival</h2>
        <ul id="lista-rival"></ul>
      </div>
    </section>
  </main>

  <footer id="pie" class="pie" hidden>
    <button id="pie-encuadre" class="pie-boton" aria-label="Encuadre perfecto" title="Encuadre perfecto">
      <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square">
        <path d="M1.5 5V1.5H5M11 1.5h3.5V5M14.5 11v3.5H11M5 14.5H1.5V11" />
        <rect x="5.5" y="5.5" width="5" height="5" />
      </svg>
    </button>
  </footer>

  <script src="app.js"></script>
</body>
</html>
