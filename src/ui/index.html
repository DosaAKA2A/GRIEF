<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GRIEF</title>
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="barra">
    <button id="menu-boton" class="menu-boton" aria-label="Menu" aria-expanded="false">
      <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path d="M1 3h14M1 8h14M1 13h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="square"/></svg>
    </button>
    <div class="marca"><img src="logo.svg" alt="" class="marca-logo"><span class="marca-nombre">GRIEF</span><span class="marca-tag">Game Tracker</span><span class="marca-sub" id="juego">Valorant · LoL</span></div>
    <div id="fase" class="fase" hidden>
      <i class="fase-punto"></i><span id="fase-texto"></span>
    </div>
    <div id="estado" class="estado">Conectando...</div>
    <!-- Conmutador de plataforma: Riot son los trackers, Steam los controles de Dota -->
    <div class="plataformas" role="group" aria-label="Plataforma">
      <button id="plat-riot" class="plat" type="button" aria-pressed="true" aria-label="Riot" data-tip="Riot · Valorant, League of Legends y TFT">
        <!-- Trazado de Assets/Riot_Games_Symbol_0.svg, con currentColor en vez del rojo de marca -->
        <svg viewBox="0 0 57.3 53.2" aria-hidden="true"><path fill="currentColor" d="M32.1,0L0,14.9l8,30.5l6.1-0.8l-1.7-19.2l2-0.9l3.5,19.6l10.4-1.3l-1.9-21.1l2-0.9l3.8,21.5l10.5-1.3l-2-23.2l2-0.9l4.2,23.6l10.4-1.3v-33L32.1,0z M32.9,46.2l0.5,3l23.9,4v-10L32.9,46.2L32.9,46.2z"/></svg>
      </button>
      <button id="plat-steam" class="plat" type="button" aria-pressed="false" aria-label="Steam" data-tip="Steam · Perfiles de controles de Dota 2">
        <!-- Trazado de Assets/Steam_icon_logo.svg: solo la marca, sin el circulo azul de fondo -->
        <svg viewBox="0 11.81 54.61 41.47" aria-hidden="true"><path fill="currentColor" d="M30.31 23.985l.003.158-7.83 11.375c-1.268-.058-2.54.165-3.748.662a8.14 8.14 0 0 0-1.498.8L.042 29.893s-.398 6.546 1.26 11.424l12.156 5.016c.6 2.728 2.48 5.12 5.242 6.27a8.88 8.88 0 0 0 11.603-4.782 8.89 8.89 0 0 0 .684-3.656L42.18 36.16l.275.005c6.705 0 12.155-5.466 12.155-12.18s-5.44-12.16-12.155-12.174c-6.702 0-12.155 5.46-12.155 12.174zm-1.88 23.05c-1.454 3.5-5.466 5.147-8.953 3.694a6.84 6.84 0 0 1-3.524-3.362l3.957 1.64a5.04 5.04 0 0 0 6.591-2.719 5.05 5.05 0 0 0-2.715-6.601l-4.1-1.695c1.578-.6 3.372-.62 5.05.077 1.7.703 3 2.027 3.696 3.72s.692 3.56-.01 5.246M42.466 32.1a8.12 8.12 0 0 1-8.098-8.113 8.12 8.12 0 0 1 8.098-8.111 8.12 8.12 0 0 1 8.1 8.111 8.12 8.12 0 0 1-8.1 8.113m-6.068-8.126a6.09 6.09 0 0 1 6.08-6.095c3.355 0 6.084 2.73 6.084 6.095a6.09 6.09 0 0 1-6.084 6.093 6.09 6.09 0 0 1-6.081-6.093z"/></svg>
      </button>
    </div>
  </header>

  <nav id="menu-panel" class="menu-panel" hidden aria-label="Menu de la app">
    <button id="menu-acerca" class="menu-item">Acerca de</button>
    <button id="menu-terminos" class="menu-item">Términos y condiciones</button>
    <button id="menu-actualizar" class="menu-item">Actualizar app</button>
    <span id="menu-estado" class="menu-estado" hidden></span>
  </nav>

  <div id="modal" class="modal" hidden>
    <div class="modal-caja" role="dialog" aria-modal="true" aria-labelledby="modal-titulo">
      <header class="modal-cabecera">
        <h3 id="modal-titulo"></h3>
        <button id="modal-cerrar" class="modal-cerrar" aria-label="Cerrar">&#215;</button>
      </header>
      <div id="modal-cuerpo" class="modal-cuerpo"></div>
    </div>
  </div>

  <template id="tpl-acerca">
    <p class="modal-destacado">GRIEF <span id="acerca-version"></span></p>
    <p>Tracker de partidas de Valorant y League of Legends. Lee los datos que el cliente de Riot ya tiene en tu computadora: no se mete en el juego y no envía nada a internet.</p>
    <p>Un proyecto de IRIS Studio.</p>
    <p><a href="https://grief.es" target="_blank" rel="noopener">grief.es</a> &middot; <a href="https://github.com/DosaAKA2A/GRIEF" target="_blank" rel="noopener">GitHub</a></p>
    <p class="modal-nota">GRIEF no está afiliado a Riot Games ni cuenta con su respaldo. Riot Games, Valorant y League of Legends son marcas de Riot Games, Inc.</p>
  </template>

  <template id="tpl-terminos">
    <p>Al usar GRIEF aceptas estas condiciones:</p>
    <ul>
      <li><b>Tus datos.</b> GRIEF lee la información que el cliente de Riot expone en tu computadora. Todo se procesa ahí mismo: no guardamos ni enviamos tus datos a ningún lado.</li>
      <li><b>Señales.</b> Las alertas de posible cheater, smurf o booster son estimaciones y pueden equivocarse. Tómalas como una pista, no como una certeza.</li>
      <li><b>Riot Games.</b> GRIEF no modifica el juego ni interactúa con él. Aun así, usar herramientas externas es siempre responsabilidad de cada jugador.</li>
      <li><b>Responsabilidad.</b> IRIS Studio no se hace responsable de problemas o decisiones derivados de usar la app.</li>
      <li><b>Actualizaciones.</b> Las versiones nuevas se publican en GitHub. La app te avisa cuando hay una; instalarla es decisión tuya.</li>
    </ul>
  </template>

  <main class="contenido">
    <section id="vacio" class="vacio">
      <svg class="vacio-radar" viewBox="0 0 100 100" aria-hidden="true">
        <circle cx="50" cy="50" r="48" />
        <circle cx="50" cy="50" r="32" />
        <circle cx="50" cy="50" r="16" />
        <line x1="50" y1="50" x2="50" y2="2" class="aguja" />
      </svg>
      <h1 class="vacio-titulo">Sin partida</h1>
      <p class="vacio-detalle">Abre Valorant o League of Legends para empezar</p>
    </section>

    <!-- Perfil propio: se muestra con el cliente abierto y sin partida -->
    <section id="perfil" class="perfil" hidden>
      <div class="perfil-cab">
        <!-- Avatar: el icono de perfil del juego que lo tenga (LoL/TFT) -->
        <div id="perfil-avatar" class="perfil-avatar" hidden>
          <img id="perfil-avatar-img" src="" alt="">
          <span id="perfil-avatar-nivel" class="perfil-avatar-nivel"></span>
        </div>
        <div class="perfil-rango">
          <img id="perfil-rango-img" class="perfil-rango-img" src="" alt="">
          <div class="perfil-rango-textos">
            <span id="perfil-rango-nombre" class="perfil-rango-nombre"></span>
            <span id="perfil-rr" class="perfil-rr"></span>
            <div class="perfil-rr-barra"><i id="perfil-rr-relleno"></i></div>
          </div>
        </div>
        <div class="perfil-id">
          <h1 id="perfil-nombre"></h1>
          <span id="perfil-sub" class="perfil-sub"></span>
        </div>
        <div class="perfil-lados">
          <div class="perfil-lado">
            <img id="perfil-peak-img" class="perfil-peak-img" src="" alt="">
            <div><small>Peak</small><span id="perfil-peak"></span></div>
          </div>
          <div class="perfil-lado">
            <img id="perfil-agente-img" class="perfil-agente-img" src="" alt="">
            <div><small>Agente top</small><span id="perfil-agente"></span></div>
          </div>
        </div>
      </div>

      <div id="perfil-tiles" class="perfil-tiles"></div>

      <div class="perfil-partidas">
        <h2 id="perfil-partidas-titulo">Últimas competitivas</h2>
        <ul id="perfil-lista"></ul>
      </div>
    </section>

    <!-- Comps de TFT del parche: se abre desde el menu -->
    <section id="comps" class="comps" hidden>
      <div class="comps-cab">
        <div class="comps-titulos">
          <h1>Comps de TFT</h1>
          <span id="comps-sub" class="comps-sub"></span>
        </div>
        <label class="comps-filtro">
          <small>Tier</small>
          <select id="comps-tier">
            <option value="">Todas</option>
            <option value="S">S</option>
            <option value="A">A</option>
            <option value="B">B</option>
            <option value="C">C</option>
          </select>
        </label>
        <label class="comps-filtro">
          <small>Carry</small>
          <select id="comps-carry"><option value="">Cualquiera</option></select>
        </label>
        <button id="comps-cerrar" class="comps-cerrar" type="button">Volver</button>
      </div>
      <ul id="comps-lista" class="comps-lista"></ul>
    </section>

    <!-- Perfiles de controles de Dota 2: se abre con el boton de Steam -->
    <section id="dota" class="dota" hidden>
      <h1 class="dota-titulo">Controles de Dota</h1>

      <!-- Banner de la cuenta a la que se van a escribir los controles. Por
           defecto es la sesion abierta en Steam; se puede cambiar a cualquier
           otra cuenta de esta computadora que tenga Dota. -->
      <div class="dota-cab">
        <span class="dota-cab-foto">
          <img id="dota-cab-foto" alt="" hidden>
        </span>
        <div class="dota-cab-info">
          <span id="dota-cab-etiqueta" class="dota-cab-etiqueta"></span>
          <span id="dota-cab-nick" class="dota-cab-nick"></span>
          <span id="dota-sub" class="dota-sub"></span>
        </div>
        <div id="dota-otras" class="dota-otras" hidden>
          <small>Cambiar de cuenta</small>
          <div id="dota-cuentas" class="dota-cuentas"></div>
        </div>
      </div>

      <div class="dota-guardar">
        <input id="dota-nombre" class="dota-campo" type="text" maxlength="48" placeholder="Ponle un nombre a tus controles de ahora">
        <button id="dota-nuevo" class="dota-boton dota-boton--guardar" type="button">Guardar preset</button>
        <button id="dota-deshacer" class="dota-boton dota-boton--tenue" type="button" hidden>Deshacer</button>
      </div>

      <p id="dota-aviso" class="dota-aviso" hidden></p>

      <h2 class="dota-titulo-lista">Tus presets</h2>
      <ul id="dota-lista" class="dota-lista"></ul>
    </section>

    <section id="equipos" class="equipos" hidden>
      <div id="banda" class="banda" hidden>
        <div class="banda-textos">
          <span id="banda-titulo" class="banda-titulo"></span>
          <span id="banda-sub" class="banda-sub"></span>
        </div>
      </div>
      <div class="equipo aliado">
        <h2 id="titulo-aliado">Tu equipo</h2>
        <ul id="lista-aliado"></ul>
      </div>
      <div class="equipo rival" id="panel-rival">
        <h2 id="titulo-rival">Rival</h2>
        <ul id="lista-rival"></ul>
      </div>
    </section>
  </main>

  <footer id="pie" class="pie" hidden>
    <!-- Es la version; solo cuando hay release nueva se vuelve el boton de actualizar -->
    <a id="pie-version" class="pie-version" target="_blank" rel="noopener"></a>
    <div class="pie-acciones">
      <span id="pie-aviso" class="pie-aviso" hidden></span>
      <button id="pie-encuadre" class="pie-boton" aria-label="Encuadre perfecto" title="Encuadre perfecto">
        <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square">
          <path d="M1.5 5V1.5H5M11 1.5h3.5V5M14.5 11v3.5H11M5 14.5H1.5V11" />
          <rect x="5.5" y="5.5" width="5" height="5" />
        </svg>
      </button>
      <button id="pie-captura" class="pie-boton pie-boton--destacado" aria-label="Copiar captura de la partida" title="Copiar captura de la partida">
        <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square">
          <path d="M1.5 5.5h2.5L5.5 3h5L12 5.5h2.5v8H1.5z" />
          <circle cx="8" cy="9" r="2.4" />
        </svg>
      </button>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
