name = "grief-tft"
main = "src/index.js"
compatibility_date = "2026-08-01"

# Region de la que se sacan las partidas de referencia.
# PLATAFORMA es el servidor (na1, euw1, la1...) y RUTA su region de match-v1.
[vars]
PLATAFORMA = "na1"
RUTA = "americas"
JUGADORES = "6"       # cuantos challenger se miran por ronda
PARTIDAS = "5"        # cuantas partidas recientes de cada uno
PARTIDAS_RONDA = "30" # tope de partidas nuevas por ronda (limite de subpeticiones)

# Cache de las comps ya calculadas. Crear con:
#   npx wrangler kv namespace create COMPS
# y pegar aqui el id que devuelva.
[[kv_namespaces]]
binding = "COMPS"
id = "963d2be5ffa143c3bcdda6d65fcc3ab9"

# Muestreo APAGADO: sin una Personal API Key de Riot cada ronda termina en 401,
# asi que el cron solo gastaba peticiones. Para reactivarlo, devolver la linea
# de abajo (una ronda cada media hora: la muestra crece sola sin rozar ningun
# limite) y volver a desplegar.
[triggers]
crons = []
